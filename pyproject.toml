[project]
name = "cellestial"
version = "0.60.0"
description = "Interactive single-cell and spatial omics visualization library"
authors = [
    { name = "Zaf4", email = "zafermolbio@gmail.com" },
]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<4.0"
keywords = [
    "anndata",
    "bioinformatics",
    "data-visualization",
    "lets-plot",
    "polars",
    "single-cell",
    "spatial-omics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "anndata>=0.10.8,<1.0",
    "lets-plot>=4.11.0,<5.0.0",
    "numpy>=1.26,<3",
    "pandas>=2.2.3,<3",
    "polars[pyarrow]>=1.30.0,<2.0.0",
    "scikit-image>=0.23.1,<1.0",
    "scipy>=1.12,<2",
    "spatialdata>=0.7,<1.0",
    "tqdm>=4,<5",
    "mudata (>=0.3.8,<0.4.0)",
]

[project.urls]
Documentation = "https://cellestial.datavil.org"
Homepage = "https://cellestial.datavil.org"
Repository = "https://github.com/DataVil/Cellestial"
Issues = "https://github.com/DataVil/Cellestial/issues"

[project.optional-dependencies]
extras = [
    "matplotlib>=3.9,<4.0",
    "scanpy[leiden]>=1.10.4,<2.0.0",
    "scvelo>=0.3.3,<0.4.0",
]

[tool.poetry]

[tool.poetry.group.dev.dependencies]
ipykernel = "^7.1.0"
ruff = "^0.15.12"
mypy = "^2.0.0"
pooch = "^1.8.2"
scanpy = {extras = ["leiden"], version = "^1.10.4"}
pycairo = "^1.27.0"
cairosvg = "^2.7.1"
scvelo = "^0.3.3"
ty = "^0.0.34"
tqdm = "^4.67.3"
pytest = "^9.0.3"
pytest-cov = "^7.1.0"
nbstripout = "^0.9.1"
pytest-xdist = "^3.8.0"
pytest-playwright = "^0.8.0"

[tool.poetry.group.docs.dependencies]
sphinx = ">=8.0.0"
pydata-sphinx-theme = "^0.16.1"
jupyter-sphinx = "^0.5.3"
ipython = "^9.13.0"
furo = "^2025.12.19"
sphinx-copybutton = "^0.5.2"
sphinx-design = "^0.7.0"
squidpy = "^1.8.1"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n 4 --dist=loadscope -m 'not browser' --cov=cellestial --cov-report=xml:tests/coverage.xml --cov-report=term-missing"
markers = [
    "browser: exercises Lets-Plot in a real browser",
]

[tool.coverage.run]
data_file = "tests/.coverage"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
