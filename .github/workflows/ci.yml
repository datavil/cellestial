name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check
          src: cellestial
      - uses: astral-sh/ruff-action@v3
        with:
          args: format --check
          src: cellestial

  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install system cairo (Linux only — macOS uses prebuilt wheels)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev pkg-config

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}

      - name: Install project
        run: poetry install --with dev --without docs --no-interaction

      - name: Cache preprocessed pbmc3k fixture
        uses: actions/cache@v4
        with:
          path: |
            data/pbmc3k_pped.h5ad
            ~/.cache/scverse_tutorials
            ~/Library/Caches/scverse_tutorials
            ~/AppData/Local/scverse_tutorials/Cache
          key: pbmc3k-${{ runner.os }}-${{ hashFiles('test/get_data.py') }}

      - name: Prepare test fixture
        shell: bash
        run: |
          mkdir -p data
          poetry run python -c "import sys; sys.path.insert(0, 'test'); from get_data import get_pbmc3k; get_pbmc3k()"

      - name: Run tests with coverage
        run: poetry run pytest

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Build wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: snok/install-poetry@v1
      - name: Build distribution
        run: poetry build
      - name: Verify wheel installs and imports
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install dist/*.whl
          /tmp/wheel-check/bin/python -c "import cellestial; print('ok:', cellestial.__name__)"
